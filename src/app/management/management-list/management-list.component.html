<div class="card border-0 shadow-sm rounded-3 overflow-hidden">
  <div class="card-header bg-white border-bottom py-3">
    <div class="row align-items-center">
      <div class="col">
        <h5 class="mb-0 text-dark fw-semibold">Management Members</h5>
      </div>
      <div class="col-md-4">
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0">
            <i class="bi bi-search text-muted"></i>
          </span>
          <input type="text" class="form-control bg-light border-start-0 ps-0" 
            placeholder="Search management..." [(ngModel)]="searchText" (ngModelChange)="onSearchChange()">
        </div>
      </div>
    </div>
  </div>

  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="bg-light text-muted small text-uppercase fw-bold">
          <tr>
            <th class="ps-4 py-3" style="width: 40px">#</th>
            <th class="py-3" style="width: 60px">Photo</th>
            <th class="py-3">First Name</th>
            <th class="py-3" style="width: 120px">Last Name</th>
            <th class="py-3">Position</th>
            <th class="py-3 text-end pe-4" style="width: 150px;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let member of paginatedManagement; let i = index">
            <td class="ps-4 fw-medium text-muted small">{{ ((page - 1) * pageSize) + i + 1 }}</td>
            <td>
              <div style="width: 40px; height: 40px; border-radius: 50%; overflow: hidden; background-color: #f8f9fa;">
                <img *ngIf="member.img" [src]="'management/'+member.img | getDownloadURL | async" style="width: 100%; height: 100%; object-fit: cover;" alt="">
                <img *ngIf="!member.img" src="assets/img/stock.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="">
              </div>
            </td>
            <td class="fw-medium">{{ member.firstName }}</td>
            <td class="text-secondary">{{ member.lastName }}</td>
            <td>
              <span class="badge bg-light text-dark border fw-normal">{{ member.position }}</span>
            </td>
            <td class="text-end pe-4">
              <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-primary px-3" [routerLink]="['/management', member.id]">
                  <i class="bi bi-eye me-1"></i> Details
                </button>
                <button class="btn btn-outline-secondary px-3" [routerLink]="['/management', member.id, 'edit']">
                  <i class="bi bi-pencil me-1"></i> Edit
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Empty State -->
    <div *ngIf="!filteredManagement.length && !isFetching" class="text-center py-5">
      <i class="bi bi-person-badge text-muted display-4"></i>
      <p class="mt-3 text-secondary">No management members found matching your search.</p>
    </div>

    <!-- Loading State -->
    <div *ngIf="isFetching" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-3 text-secondary">Fetching management members...</p>
    </div>
  </div>

  <app-pagination-controls
    *ngIf="filteredManagement.length && !isFetching"
    [page]="page"
    [pageSize]="pageSize"
    [totalItems]="filteredManagement.length"
    itemLabel="management records"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)">
  </app-pagination-controls>
</div>
