<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm rounded-3">
        <div class="card-header bg-white border-bottom py-3">
          <h5 class="mb-0 fw-semibold text-primary">
            <i class="bi bi-person-badge-fill me-2"></i>Add Management Member
          </h5>
        </div>
        
        <div class="card-body p-4">
          <form (ngSubmit)="onSaveMember(M)" #M="ngForm" class="needs-validation">
            
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="firstName" class="form-label small fw-bold text-muted text-uppercase">First Name</label>
                <input type="text" class="form-control bg-light border-0 py-2" id="firstName"
                  ngModel name="firstName" required #firstName="ngModel" placeholder="First Name">
                <div class="text-danger small mt-1" *ngIf="firstName.invalid && firstName.touched">
                  First name is required
                </div>
              </div>
              <div class="col-md-6">
                <label for="lastName" class="form-label small fw-bold text-muted text-uppercase">Last Name</label>
                <input type="text" class="form-control bg-light border-0 py-2" id="lastName"
                  ngModel name="lastName" required #lastName="ngModel" placeholder="Last Name">
                <div class="text-danger small mt-1" *ngIf="lastName.invalid && lastName.touched">
                  Last name is required
                </div>
              </div>
            </div>

            <div class="mb-4">
              <label for="position" class="form-label small fw-bold text-muted text-uppercase">Position / Role</label>
              <input type="text" class="form-control bg-light border-0 py-2" id="position"
                ngModel name="position" required #position="ngModel" placeholder="e.g. Executive Director">
              <div class="text-danger small mt-1" *ngIf="position.invalid && position.touched">
                Position is required
              </div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="email" class="form-label small fw-bold text-muted text-uppercase">Email Address</label>
                <input type="email" class="form-control bg-light border-0 py-2" id="email"
                  ngModel name="email" placeholder="email@example.com">
              </div>
              <div class="col-md-6">
                <label for="telephone" class="form-label small fw-bold text-muted text-uppercase">Telephone</label>
                <input type="tel" class="form-control bg-light border-0 py-2" id="telephone"
                  ngModel name="telephone" placeholder="e.g. +233...">
              </div>
            </div>

            <div class="mb-4">
              <label for="residence" class="form-label small fw-bold text-muted text-uppercase">Residence</label>
              <input type="text" class="form-control bg-light border-0 py-2" id="residence"
                ngModel name="residence" placeholder="Current address">
            </div>

            <div class="mb-4">
              <label for="description" class="form-label small fw-bold text-muted text-uppercase">Description / Notes</label>
              <textarea class="form-control bg-light border-0 py-2" id="description" rows="3"
                ngModel name="description" placeholder="Any additional notes..."></textarea>
            </div>

            <hr class="my-4 text-muted opacity-25">

            <!-- Profile Image Section -->
            <div class="mb-4">
              <label for="imgUpload" class="form-label small fw-bold text-muted text-uppercase">Profile Photo</label>
              <div class="d-flex align-items-start gap-4">
                <div class="shadow-sm rounded-circle bg-light d-flex align-items-center justify-content-center overflow-hidden" 
                     style="width: 250px; height: 250px; border: 2px dashed #dee2e6; padding: 6px;">
                  <img *ngIf="imgDownloadURL | async" [src]="imgDownloadURL | async" class="rounded-circle object-fit-cover w-100 h-100" alt="Profile preview">
                  <i *ngIf="!(imgDownloadURL | async)" class="bi bi-person text-muted display-1"></i>
                </div>
                <div class="flex-grow-1">
                  <input type="file" class="form-control border-0 bg-light py-2" id="imgUpload" 
                         (change)="onuploadProfileImg($event)">
                  <div class="mt-2" *ngIf="isUploading">
                    <div class="progress" style="height: 4px;">
                      <div class="progress-bar" role="progressbar" [style.width]="(imgUploadPercent | async) + '%'"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="pt-3">
              <button type="submit" class="btn btn-primary btn-lg w-100 py-3 rounded-3 fw-bold shadow-sm"
                [disabled]="(!M.valid || isUploading)">
                <i class="bi bi-save me-2"></i>Save Member Profile
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
