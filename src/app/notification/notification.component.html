<div class="position-fixed top-0 start-50 translate-middle-x mt-3" style="z-index: 1080; min-width: 300px;">
  <div *ngIf="showStatus" class="alert alert-dismissible fade show shadow-sm border-0 d-flex align-items-center" 
       [class.alert-danger]="isError" [class.alert-success]="!isError" role="alert">
    <i class="bi me-2 fs-5" [class.bi-exclamation-circle-fill]="isError" [class.bi-check-circle-fill]="!isError"></i>
    <div>{{message}}</div>
    <button type="button" class="btn-close" (click)="reset()" aria-label="Close"></button>
  </div>
</div>
