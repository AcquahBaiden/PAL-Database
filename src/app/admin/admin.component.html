<div class="card border-0 shadow-sm rounded-3 overflow-hidden">
  <div class="card-header bg-white border-bottom py-3">
    <div class="row align-items-center">
      <div class="col">
        <h5 class="mb-0 text-dark fw-semibold">User Access Control</h5>
      </div>
      <div class="col-md-4">
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0">
            <i class="bi bi-search text-muted"></i>
          </span>
          <input type="text" class="form-control bg-light border-start-0 ps-0" 
            placeholder="Search by email..." [(ngModel)]="searchText">
        </div>
      </div>
    </div>
  </div>

  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="bg-light text-muted small text-uppercase fw-bold">
          <tr>
            <th class="ps-4 py-3">User Email</th>
            <th class="py-3 text-center">Basic Access</th>
            <th class="py-3 text-center">Children</th>
            <th class="py-3 text-center">Volunteers</th>
            <th class="py-3 text-center">Management</th>
            <th class="py-3 text-center pe-4">Archived</th>
          </tr>
        </thead>
        <tbody app-access-control *ngFor="let userAccess of usersAccessList | async | adminFilter: searchText" [userAccessData]="userAccess">
        </tbody>
      </table>
    </div>

    <!-- Empty State -->
    <div *ngIf="!(usersAccessList | async | adminFilter: searchText)?.length && !isFetching" class="text-center py-5">
      <i class="bi bi-shield-lock text-muted display-4"></i>
      <p class="mt-3 text-secondary">No users found matching your search.</p>
    </div>

    <!-- Loading State -->
    <div *ngIf="isFetching" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-3 text-secondary">Fetching user access data...</p>
    </div>
  </div>
</div>
