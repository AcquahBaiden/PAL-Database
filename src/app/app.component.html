<app-notification></app-notification>

<ng-container *ngIf="sessionStore.session$ | async as session">
  <div id="loader-wrapper" *ngIf="session.status === 'loading'" class="vh-100 d-flex justify-content-center align-items-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading ...</span>
    </div>
  </div>
  <div class="min-vh-100 d-flex flex-column" *ngIf="session.status !== 'loading'">
    <div *ngIf="session.status === 'signedIn'; else login" class="flex-grow-1 d-flex flex-column vh-100 overflow-hidden">
      <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm border-bottom py-3 flex-shrink-0 z-3">
        <div class="container-fluid px-4">
          <div class="d-flex align-items-center">
            <a class="navbar-brand d-flex align-items-center fw-bold text-primary me-4" href="#">
              <i class="bi bi-layers-fill fs-4 me-2"></i>
              <span>PAL Database</span>
            </a>
          </div>
          <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarContent">
            <div class="ms-auto d-flex align-items-center gap-3">
              <app-header></app-header>
              <div class="vr d-none d-lg-block mx-1"></div>
              <button class="btn btn-light border-0 text-danger fw-medium d-flex align-items-center px-3" (click)="onLogout()">
                <i class="bi bi-box-arrow-right me-2"></i> Logout
              </button>
            </div>
          </div>
        </div>
      </nav>

      <div class="d-flex flex-grow-1 overflow-hidden position-relative">
        <div class="bg-white border-end shadow-sm flex-shrink-0 z-2" 
             style="transition: width 0.3s ease;"
             [style.width]="isSidebarCollapsed ? '60px' : '220px'">
           <app-side-bar [isCollapsed]="isSidebarCollapsed" (toggleSidebar)="toggleSidebar()"></app-side-bar>
        </div>
        <div class="bg-light py-4 flex-grow-1 overflow-auto w-100">
          <div id="feedback-container" class="container-fluid px-lg-4"></div>
          <div class="container-fluid px-lg-4">
            <router-outlet></router-outlet>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-container>

<ng-template #login>
  <div class="container vh-100 d-flex justify-content-center align-items-center bg-light">
    <div class="card shadow-lg border-0 overflow-hidden" style="width: 26rem; border-radius: 1rem;">
      <div class="card-header bg-white p-0 border-bottom">
        <div class="d-flex text-center">
          <div class="flex-fill py-3 role-button border-bottom border-3" 
               [class.border-primary]="formIsLogin" [class.text-primary]="formIsLogin" [class.fw-bold]="formIsLogin"
               (click)="toggleLogInView('login')" style="cursor: pointer;">
            Login
          </div>
          <div class="flex-fill py-3 role-button border-bottom border-3" 
               [class.border-primary]="!formIsLogin" [class.text-primary]="!formIsLogin" [class.fw-bold]="!formIsLogin"
               (click)="toggleLogInView('signIn')" style="cursor: pointer;">
            Sign Up
          </div>
        </div>
      </div>
      
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <img src="assets/img/stock.jpeg" alt="Logo" width="60" class="mb-3 rounded-circle shadow-sm" style="object-fit: cover; height: 60px;">
          <h3 class="h4 fw-bold text-dark">{{ formIsLogin ? 'Welcome Back' : 'Create Account' }}</h3>
          <p class="text-muted small">{{ formIsLogin ? 'Enter your credentials to access your account' : 'Join the PAL Foundation database' }}</p>
        </div>

        <div class="alert alert-danger d-flex align-items-center py-2 px-3 mb-4" role="alert" *ngIf="isLoginError">
          <i class="bi bi-exclamation-triangle-fill me-2 flex-shrink-0"></i>
          <div class="small fw-medium">{{errorMessage}}</div>
        </div>
        
        <!-- Login Form -->
        <form #loginForm="ngForm" *ngIf="formIsLogin">
          <div class="mb-3">
            <label for="loginEmail" class="form-label small fw-bold text-muted text-uppercase">Email address</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-0"><i class="bi bi-envelope text-muted"></i></span>
              <input type="email" class="form-control bg-light border-0 py-2" id="loginEmail"
                ngModel name="email" required #email="ngModel" placeholder="name@example.com">
            </div>
          </div>
          <div class="mb-4">
            <label for="loginPassword" class="form-label small fw-bold text-muted text-uppercase">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-0"><i class="bi bi-lock text-muted"></i></span>
              <input type="password" class="form-control bg-light border-0 py-2" id="loginPassword"
                ngModel required name="password" #password="ngModel" placeholder="Enter password">
            </div>
            <div class="d-flex justify-content-end mt-2">
              <button
                type="button"
                class="btn btn-link btn-sm p-0 text-decoration-none"
                (click)="onPasswordReset(email.value)"
                [disabled]="isResetSubmitting || !email.valid">
                {{ isResetSubmitting ? 'Sending reset link...' : 'Forgot password?' }}
              </button>
            </div>
          </div>
          <button type="button" (click)="onSignIn(loginForm)" class="btn btn-primary w-100 py-2 rounded-3 fw-bold shadow-sm d-flex justify-content-center align-items-center" 
                  [disabled]="!loginForm.valid || isSubmitting">
            <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            {{ isSubmitting ? 'Signing in...' : 'Log in' }}
          </button>
        </form>

        <!-- Sign Up Form -->
        <form #signUpForm="ngForm" *ngIf="!formIsLogin">
          <div class="mb-3">
            <label for="signupEmail" class="form-label small fw-bold text-muted text-uppercase">Email address</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-0"><i class="bi bi-envelope text-muted"></i></span>
              <input type="email" class="form-control bg-light border-0 py-2" id="signupEmail"
                ngModel name="signupEmail" #signupEmail="ngModel" required placeholder="name@example.com">
            </div>
          </div>
          <div class="mb-4">
            <label for="signupPassword" class="form-label small fw-bold text-muted text-uppercase">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-0"><i class="bi bi-lock text-muted"></i></span>
              <input type="password" class="form-control bg-light border-0 py-2" id="signupPassword"
                ngModel name="signupPassword" #signupPassword="ngModel" required minlength="6"
                placeholder="Min. 6 characters">
            </div>
          </div>
          <button type="button" (click)="onSignUp(signUpForm)" class="btn btn-primary w-100 py-2 rounded-3 fw-bold shadow-sm d-flex justify-content-center align-items-center" 
                  [disabled]="!signUpForm.valid || isSubmitting">
            <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            {{ isSubmitting ? 'Creating account...' : 'Create account' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</ng-template>
