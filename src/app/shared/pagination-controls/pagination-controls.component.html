<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 px-4 py-3 border-top bg-white">
  <div class="text-muted small">
    Showing {{ startItem }}-{{ endItem }} of {{ totalItems }} {{ itemLabel }}
  </div>

  <div class="d-flex flex-wrap align-items-center gap-3">
    <label class="d-flex align-items-center gap-2 small text-muted mb-0">
      <span>Rows</span>
      <select class="form-select form-select-sm" [ngModel]="pageSize" (ngModelChange)="onPageSizeSelected($event)">
        <option *ngFor="let option of pageSizeOptions" [ngValue]="option">{{ option }}</option>
      </select>
    </label>

    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-sm btn-outline-secondary" type="button" (click)="onPreviousPage()" [disabled]="page <= 1">
        Previous
      </button>
      <span class="small text-muted">Page {{ page }} of {{ totalPages }}</span>
      <button class="btn btn-sm btn-outline-secondary" type="button" (click)="onNextPage()" [disabled]="page >= totalPages">
        Next
      </button>
    </div>
  </div>
</div>
