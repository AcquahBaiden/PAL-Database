<div class="card border-0 shadow-sm rounded-3 p-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="fw-bold mb-0 d-flex align-items-center">
      <i class="bi bi-clock-history me-2 text-primary"></i>{{ title }}
    </h5>
    <span class="badge bg-light text-muted border" *ngIf="versions.length">{{ versions.length }} updates</span>
  </div>

  <div *ngIf="versions.length; else emptyState" class="list-group list-group-flush border rounded-3 overflow-hidden">
    <button
      *ngFor="let version of versions"
      type="button"
      class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3"
      (click)="openVersion(version)">
      <div>
        <div class="fw-medium text-dark">{{ version.timestamp | date:'medium' }}</div>
        <div class="small text-muted">Open snapshot</div>
      </div>
      <i class="bi bi-chevron-right text-muted"></i>
    </button>
  </div>

  <ng-template #emptyState>
    <div class="text-center py-4 bg-light rounded-3 text-muted">
      {{ emptyMessage }}
    </div>
  </ng-template>
</div>

<ng-template #historyModal let-modal>
  <div class="modal-header">
    <div>
      <h5 class="modal-title mb-1">Profile Snapshot</h5>
      <div class="small text-muted" *ngIf="selectedVersion">
        {{ selectedVersion.timestamp | date:'full' }}
      </div>
    </div>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
  </div>

  <div class="modal-body">
    <div *ngIf="selectedVersionFields.length; else noFields" class="row g-3">
      <div *ngFor="let field of selectedVersionFields" class="col-md-6">
        <label class="small fw-bold text-muted text-uppercase d-block mb-1">{{ field.label }}</label>
        <div class="bg-light rounded-3 px-3 py-2 text-dark small h-100">{{ field.value }}</div>
      </div>
    </div>

    <ng-template #noFields>
      <div class="text-muted">No stored fields are available for this snapshot.</div>
    </ng-template>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="modal.close()">Close</button>
  </div>
</ng-template>
