<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm rounded-3">
        <div class="card-header bg-white border-bottom py-3">
          <h5 class="mb-0 fw-semibold text-primary">
            <i class="bi bi-person-plus-fill me-2"></i>Add New Volunteer
          </h5>
        </div>
        
        <div class="card-body p-4">
          <form (ngSubmit)="onSaveVolunteer(v)" #v="ngForm" class="needs-validation">
            
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="firstName" class="form-label small fw-bold text-muted text-uppercase">First Name</label>
                <input type="text" class="form-control bg-light border-0 py-2" id="firstName"
                  ngModel name="firstName" required #firstName="ngModel" placeholder="e.g. Jane">
                <div class="text-danger small mt-1" *ngIf="firstName.invalid && firstName.touched">
                  First name is required
                </div>
              </div>
              <div class="col-md-6">
                <label for="lastName" class="form-label small fw-bold text-muted text-uppercase">Last Name</label>
                <input type="text" class="form-control bg-light border-0 py-2" id="lastName"
                  ngModel name="lastName" required #lastName="ngModel" placeholder="e.g. Smith">
                <div class="text-danger small mt-1" *ngIf="lastName.invalid && lastName.touched">
                  Last name is required
                </div>
              </div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="email" class="form-label small fw-bold text-muted text-uppercase">Email Address</label>
                <input type="email" class="form-control bg-light border-0 py-2" id="email"
                  ngModel name="email" placeholder="jane@example.com">
              </div>
              <div class="col-md-6">
                <label for="telephone" class="form-label small fw-bold text-muted text-uppercase">Telephone</label>
                <input type="tel" class="form-control bg-light border-0 py-2" id="telephone"
                  ngModel name="telephone" placeholder="e.g. +233...">
              </div>
            </div>

            <div class="mb-4">
              <label for="residence" class="form-label small fw-bold text-muted text-uppercase">Residence</label>
              <input type="text" class="form-control bg-light border-0 py-2" id="residence"
                ngModel name="residence" placeholder="Current location">
            </div>

            <div class="card bg-light border-0 mb-4">
              <div class="card-body">
                <label class="form-label small fw-bold text-muted text-uppercase mb-3">Permanent Address</label>
                <div class="row g-2">
                  <div class="col-12 mb-2">
                    <input type="text" class="form-control border-0 py-2" ngModel name="Line1" placeholder="Address Line 1">
                  </div>
                  <div class="col-md-6">
                    <input type="text" class="form-control border-0 py-2" ngModel name="Line2" placeholder="Address Line 2">
                  </div>
                  <div class="col-md-6">
                    <input type="text" class="form-control border-0 py-2" ngModel name="Line3" placeholder="Address Line 3">
                  </div>
                </div>
              </div>
            </div>

            <hr class="my-4 text-muted opacity-25">

            <div class="row g-3 mb-4">
              <div class="col-md-4">
                <label for="level" class="form-label small fw-bold text-muted text-uppercase">Level/Year</label>
                <input type="text" class="form-control bg-light border-0 py-2" id="level"
                  ngModel name="level" placeholder="e.g. Level 300">
              </div>
              <div class="col-md-8">
                <label for="school" class="form-label small fw-bold text-muted text-uppercase">School / Institution</label>
                <input type="text" class="form-control bg-light border-0 py-2" id="school"
                  ngModel name="school" placeholder="University Name">
              </div>
            </div>

            <div class="mb-4">
              <label for="program" class="form-label small fw-bold text-muted text-uppercase">Program / Course</label>
              <input type="text" class="form-control bg-light border-0 py-2" id="program"
                ngModel name="program" placeholder="e.g. BSc Computer Science">
            </div>

            <div class="card bg-light border-0 mb-4">
              <div class="card-body">
                <label class="form-label small fw-bold text-muted text-uppercase mb-3">Volunteering Programs</label>
                <div class="row g-3">
                  <div class="col-md-4">
                    <input type="text" class="form-control border-0 py-2" ngModel name="Prog1" placeholder="Program 1">
                  </div>
                  <div class="col-md-4">
                    <input type="text" class="form-control border-0 py-2" ngModel name="Prog2" placeholder="Program 2">
                  </div>
                  <div class="col-md-4">
                    <input type="text" class="form-control border-0 py-2" ngModel name="Prog3" placeholder="Program 3">
                  </div>
                </div>
              </div>
            </div>

            <hr class="my-4 text-muted opacity-25">

            <!-- Profile Image Section -->
            <div class="mb-4">
              <label for="imgUpload" class="form-label small fw-bold text-muted text-uppercase">Profile Photo</label>
              <div class="d-flex align-items-start gap-4">
                <div class="shadow-sm rounded-circle bg-light d-flex align-items-center justify-content-center overflow-hidden" 
                     style="width: 250px; height: 250px; border: 2px dashed #dee2e6; padding: 6px;">
                  <img *ngIf="imgDownloadURL | async" [src]="imgDownloadURL | async" class="rounded-circle object-fit-cover w-100 h-100" alt="Profile preview">
                  <i *ngIf="!(imgDownloadURL | async)" class="bi bi-person text-muted display-1"></i>
                </div>
                <div class="flex-grow-1">
                  <input type="file" class="form-control border-0 bg-light py-2" id="imgUpload" 
                         (change)="onuploadProfileImg($event)" [disabled]="!v.valid">
                  <div class="mt-2" *ngIf="isUploading">
                    <div class="progress" style="height: 4px;">
                      <div class="progress-bar" role="progressbar" [style.width]="(imgUploadPercent | async) + '%'"></div>
                    </div>
                    <small class="text-muted mt-1 d-block">Uploading... {{ imgUploadPercent | async | number : '1.0-0'}}%</small>
                  </div>
                </div>
              </div>
            </div>

            <div class="pt-3">
              <button type="submit" class="btn btn-primary btn-lg w-100 py-3 rounded-3 fw-bold shadow-sm"
                [disabled]="(!v.valid || isUploading)">
                <i class="bi bi-save me-2"></i>Save Volunteer Profile
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
