<div class="card border-0 shadow-sm rounded-3 overflow-hidden">
  <div class="card-header bg-white border-bottom py-3">
    <div class="row align-items-center">
      <div class="col">
        <h5 class="mb-0 text-dark fw-semibold">PAL Children</h5>
      </div>
      <div class="col-md-4">
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0">
            <i class="bi bi-search text-muted"></i>
          </span>
          <input type="text" class="form-control bg-light border-start-0 ps-0" 
            placeholder="Search by first name..." [(ngModel)]="searchText">
        </div>
      </div>
    </div>
  </div>

  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="bg-light text-muted small text-uppercase fw-bold">
          <tr>
            <th class="ps-4 py-3" style="width: 60px">#</th>
            <th class="py-3" style="width: 80px">Photo</th>
            <th class="py-3">First Name</th>
            <th class="py-3">Last Name</th>
            <th class="py-3 text-end pe-4">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let child of childrenData | appFilter: searchText; let i=index">
            <td class="ps-4 fw-medium text-muted small">{{i + 1}}</td>
            <td>
              <div style="width: 40px; height: 40px; border-radius: 50%; overflow: hidden; background-color: #f8f9fa;">
                <img *ngIf="child.img" [src]="'children/'+child.img | getDownloadURL | async" style="width: 100%; height: 100%; object-fit: cover;" alt="">
                <img *ngIf="!child.img" src="assets/img/stock.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="">
              </div>
            </td>
            <td class="fw-medium">{{ child.firstName }}</td>
            <td class="text-secondary">{{ child.lastName }}</td>
            <td class="text-end pe-4">
              <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-primary px-3" [routerLink]="['/children', child.id]">
                  <i class="bi bi-eye me-1"></i> Details
                </button>
                <button class="btn btn-outline-secondary px-3" [routerLink]="['/children', child.id, 'edit']">
                  <i class="bi bi-pencil me-1"></i> Edit
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Empty State -->
    <div *ngIf="!(childrenData | appFilter: searchText)?.length && !isFetching" class="text-center py-5">
      <i class="bi bi-people text-muted display-4"></i>
      <p class="mt-3 text-secondary">No children found matching your search.</p>
    </div>

    <!-- Loading State -->
    <div *ngIf="isFetching" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-3 text-secondary">Fetching children records...</p>
    </div>
  </div>
</div>
