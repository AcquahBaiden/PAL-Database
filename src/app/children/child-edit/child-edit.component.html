<div *ngIf="!dataLoaded" class="text-center py-5">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<div class="container py-4" *ngIf="dataLoaded && selectedChild">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm rounded-3">
        <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
          <h5 class="mb-0 fw-semibold text-primary">
            <i class="bi bi-pencil-square me-2"></i>Edit Child Profile
          </h5>
          <button class="btn btn-sm btn-outline-secondary" [routerLink]="['../']">
            <i class="bi bi-arrow-left me-1"></i>Back to Profile
          </button>
        </div>
        
        <div class="card-body p-4">
          <!-- Profile Photo Update -->
          <div class="text-center mb-4">
            <div class="mx-auto mb-3 d-flex justify-content-center align-items-center rounded-circle bg-light shadow-sm" style="width: 250px; height: 250px; padding: 6px;">
              <img *ngIf="selectedChild.img" [src]="'children/'+selectedChild.img | getDownloadURL | async" 
                   class="rounded-circle object-fit-cover w-100 h-100" alt="Profile photo">
              <img *ngIf="!selectedChild.img" src="assets/img/stock.jpeg" 
                   class="rounded-circle object-fit-cover w-100 h-100" alt="Profile photo">
            </div>
            <div class="col-md-6 mx-auto">
              <label for="imgUpload" class="btn btn-sm btn-outline-primary mb-2">
                <i class="bi bi-camera me-1"></i> Change Photo
              </label>
              <input type="file" class="d-none" id="imgUpload" (change)="onuploadProfileImg($event)">
              <div *ngIf="isUploading" class="mt-2">
                <div class="progress" style="height: 4px; width: 150px; margin: 0 auto;">
                  <div class="progress-bar" role="progressbar" [style.width]="(uploadPercent | async) + '%'"></div>
                </div>
              </div>
            </div>
          </div>

          <form (ngSubmit)="onUpdateChild(editForm)" #editForm="ngForm" class="needs-validation">
            
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="firstName" class="form-label small fw-bold text-muted text-uppercase">First Name</label>
                <input type="text" class="form-control bg-light border-0 py-2" id="firstName"
                  ngModel name="firstName" required #firstName="ngModel">
              </div>
              <div class="col-md-6">
                <label for="lastName" class="form-label small fw-bold text-muted text-uppercase">Last Name</label>
                <input type="text" class="form-control bg-light border-0 py-2" id="lastName"
                  ngModel name="lastName" required #lastName="ngModel">
              </div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="telephone" class="form-label small fw-bold text-muted text-uppercase">Telephone</label>
                <input type="tel" class="form-control bg-light border-0 py-2" id="telephone"
                  ngModel name="telephone">
              </div>
              <div class="col-md-6">
                <label for="class" class="form-label small fw-bold text-muted text-uppercase">Class / Form</label>
                <input type="text" class="form-control bg-light border-0 py-2" id="class"
                  ngModel name="class">
              </div>
            </div>

            <div class="mb-4">
              <label for="school" class="form-label small fw-bold text-muted text-uppercase">School</label>
              <input type="text" class="form-control bg-light border-0 py-2" id="school"
                ngModel name="school">
            </div>

            <div class="mb-4">
              <label for="residence" class="form-label small fw-bold text-muted text-uppercase">Residence</label>
              <textarea class="form-control bg-light border-0 py-2" id="residence" rows="2"
                ngModel name="residence"></textarea>
            </div>

            <hr class="my-4 text-muted opacity-25">

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="parentName" class="form-label small fw-bold text-muted text-uppercase">Parent(s) Name</label>
                <input type="text" class="form-control bg-light border-0 py-2" id="parentName"
                  ngModel name="parentName">
              </div>
              <div class="col-md-6">
                <label for="parentTel" class="form-label small fw-bold text-muted text-uppercase">Parent Telephone</label>
                <input type="tel" class="form-control bg-light border-0 py-2" id="parentTel"
                  ngModel name="parentTel">
              </div>
            </div>

            <div class="mb-4">
              <label for="description" class="form-label small fw-bold text-muted text-uppercase">Notes / Description</label>
              <textarea class="form-control bg-light border-0 py-2" id="description" rows="4"
                ngModel name="description"></textarea>
            </div>

            <div class="pt-3">
              <button type="submit" class="btn btn-primary btn-lg w-100 py-3 rounded-3 fw-bold shadow-sm"
                [disabled]="!editForm.valid">
                <i class="bi bi-check-lg me-2"></i>Update Child Record
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
