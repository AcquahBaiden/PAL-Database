<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm rounded-3">
        <div class="card-header bg-white border-bottom py-3">
          <h5 class="mb-0 fw-semibold text-primary">
            <i class="bi bi-person-plus-fill me-2"></i>Add New Child
          </h5>
        </div>
        
        <div class="card-body p-4">
          <form (ngSubmit)="onSaveChild(f)" #f="ngForm" class="needs-validation">
            
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="firstName" class="form-label small fw-bold text-muted text-uppercase">First Name</label>
                <input type="text" class="form-control bg-light border-0 py-2" id="firstName"
                  ngModel name="firstName" required #firstName="ngModel" placeholder="e.g. John">
                <div class="text-danger small mt-1" *ngIf="firstName.invalid && firstName.touched">
                  First name is required
                </div>
              </div>
              <div class="col-md-6">
                <label for="lastName" class="form-label small fw-bold text-muted text-uppercase">Last Name</label>
                <input type="text" class="form-control bg-light border-0 py-2" id="lastName"
                  ngModel name="lastName" required #lastName="ngModel" placeholder="e.g. Doe">
                <div class="text-danger small mt-1" *ngIf="lastName.invalid && lastName.touched">
                  Last name is required
                </div>
              </div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="telephone" class="form-label small fw-bold text-muted text-uppercase">Telephone</label>
                <input type="tel" class="form-control bg-light border-0 py-2" id="telephone"
                  ngModel name="telephone" placeholder="e.g. +233...">
              </div>
              <div class="col-md-6">
                <label for="class" class="form-label small fw-bold text-muted text-uppercase">Class / Form</label>
                <input type="text" class="form-control bg-light border-0 py-2" id="class"
                  ngModel name="class" placeholder="e.g. Primary 4">
              </div>
            </div>

            <div class="mb-4">
              <label for="school" class="form-label small fw-bold text-muted text-uppercase">School</label>
              <input type="text" class="form-control bg-light border-0 py-2" id="school"
                ngModel name="school" placeholder="School Name">
            </div>

            <div class="mb-4">
              <label for="residence" class="form-label small fw-bold text-muted text-uppercase">Residence</label>
              <textarea class="form-control bg-light border-0 py-2" id="residence" rows="2"
                ngModel name="residence" placeholder="Current address"></textarea>
            </div>

            <hr class="my-4 text-muted opacity-25">

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="parentName" class="form-label small fw-bold text-muted text-uppercase">Parent(s) Name</label>
                <input type="text" class="form-control bg-light border-0 py-2" id="parentName"
                  ngModel name="parentName" placeholder="Parent/Guardian name">
              </div>
              <div class="col-md-6">
                <label for="parentTel" class="form-label small fw-bold text-muted text-uppercase">Parent Telephone</label>
                <input type="tel" class="form-control bg-light border-0 py-2" id="parentTel"
                  ngModel name="parentTel" placeholder="Parent contact">
              </div>
            </div>

            <div class="mb-4">
              <label for="description" class="form-label small fw-bold text-muted text-uppercase">Notes / Description</label>
              <textarea class="form-control bg-light border-0 py-2" id="description" rows="3"
                ngModel name="description" placeholder="Any additional information..."></textarea>
            </div>

            <hr class="my-4 text-muted opacity-25">

            <!-- Interests Section -->
            <div class="mb-4">
              <label class="form-label small fw-bold text-muted text-uppercase">Interests</label>
              <div class="input-group mb-3">
                <input type="text" class="form-control bg-light border-0 py-2" id="interestInput"
                  ngModel name="interestInput" #interestInput="ngModel" placeholder="e.g. Football, Reading">
                <button class="btn btn-primary px-4" type="button" (click)="onAddInterest(interestInput)">
                  <i class="bi bi-plus-lg"></i>
                </button>
              </div>
              <div class="d-flex flex-wrap gap-2 mt-2">
                <span *ngFor="let interest of interests; let i = index" 
                  class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-3 py-2 fw-normal d-flex align-items-center">
                  {{interest}}
                  <button type="button" class="btn-close ms-2" style="font-size: 0.5rem;" (click)="onRemoveInterest(i)"></button>
                </span>
              </div>
            </div>

            <!-- Programs Section -->
            <div class="mb-4">
              <label class="form-label small fw-bold text-muted text-uppercase">Programs</label>
              <div class="row g-2 mb-3">
                <div class="col-7">
                  <input type="text" class="form-control bg-light border-0 py-2" 
                    ngModel name="programName" #pName="ngModel" placeholder="Program Name">
                </div>
                <div class="col-3">
                  <input type="text" class="form-control bg-light border-0 py-2" 
                    ngModel name="programYear" #pYear="ngModel" placeholder="Year">
                </div>
                <div class="col-2">
                  <button class="btn btn-primary w-100 py-2" type="button" (click)="onAddProgram(pName, pYear)">
                    <i class="bi bi-plus-lg"></i>
                  </button>
                </div>
              </div>
              <div class="list-group list-group-flush border rounded-3 overflow-hidden" *ngIf="programs.length">
                <div *ngFor="let program of programs; let i = index" 
                  class="list-group-item d-flex justify-content-between align-items-center py-2">
                  <span>{{program.program}} ({{program.year}})</span>
                  <button type="button" class="btn btn-sm btn-link text-danger p-0" (click)="onRemoveProgram(i)">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </div>
            </div>

            <hr class="my-4 text-muted opacity-25">

            <!-- Profile Image Section -->
            <div class="mb-4">
              <label for="imgUpload" class="form-label small fw-bold text-muted text-uppercase">Profile Photo</label>
              <div class="d-flex align-items-start gap-4">
                <div class="profile-preview shadow-sm rounded-circle bg-light d-flex align-items-center justify-content-center overflow-hidden" 
                     style="width: 120px; height: 120px; border: 2px dashed #dee2e6;">
                  <img *ngIf="imgDownloadURL | async" [src]="imgDownloadURL | async" class="img-fluid h-100 w-100 object-fit-cover" alt="Profile preview">
                  <i *ngIf="!(imgDownloadURL | async)" class="bi bi-person text-muted display-4"></i>
                </div>
                <div class="flex-grow-1">
                  <input type="file" class="form-control border-0 bg-light py-2" id="imgUpload" 
                         (change)="onuploadProfileImg($event)" [disabled]="!f.valid">
                  <div class="mt-2" *ngIf="isUploading">
                    <div class="progress" style="height: 4px;">
                      <div class="progress-bar" role="progressbar" [style.width]="(imgUploadPercent | async) + '%'"></div>
                    </div>
                    <small class="text-muted mt-1 d-block">Uploading... {{ imgUploadPercent | async | number : '1.0-0'}}%</small>
                  </div>
                  <small class="text-muted d-block mt-2">Recommended: Square image, max 2MB.</small>
                </div>
              </div>
            </div>

            <div class="pt-3">
              <button type="submit" class="btn btn-primary btn-lg w-100 py-3 rounded-3 fw-bold shadow-sm"
                [disabled]="(!f.valid || isUploading)">
                <i class="bi bi-save me-2"></i>Save Child Profile
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
